name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ASM_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e "./workers[worker]" -e "./backend[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check app ../workers/asm_sensors
      - name: Tests (sensors, backend, tenant isolation, API)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          sed 's/CHANGE_ME/ci-placeholder-value-0123456789/' .env.example > .env
          docker compose config --quiet
      - name: Build platform and web images
        run: docker compose build asm-api asm-web
      - name: Build sensor image
        run: docker compose build asm-scanner
      - name: Sensor tool versions
        run: docker compose run --rm --no-deps asm-scanner versions
