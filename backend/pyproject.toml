[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exteriq-asm"
version = "0.1.0"
description = "Exteriq ASM - Continuous External Attack Surface Management platform"
requires-python = ">=3.12"
license = { text = "LicenseRef-AlRasedah-Proprietary" }
dependencies = [
  "asm-sensors",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "gunicorn>=22",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "cryptography>=42",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "httpx>=0.27",
  "dnspython>=2.6",
  "tldextract>=5.1",
  "croniter>=2.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pyotp>=2.9",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62"]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.5", "respx>=0.21"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["reporting/templates/*.html", "reporting/templates/*.css"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
# B008: FastAPI's Depends() defaults; UP046: pydantic generic models; S101: asserts guard invariants.
ignore = ["S101", "B008", "S311", "S104", "UP046"]

[tool.ruff.lint.per-file-ignores]
# Audit action names contain words like "password"/"token"; they are not secrets.
"app/services/audit.py" = ["S105"]
"app/api/v1/auth.py" = ["S105"]
"app/auth/service.py" = ["S105"]
"app/schemas/auth.py" = ["S105"]
# Static RLS DDL built from constants (no user input).
"app/db/rls.py" = ["S608"]
