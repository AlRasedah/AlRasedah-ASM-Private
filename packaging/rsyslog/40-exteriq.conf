# Exteriq ASM log collector (installed by the exteriq package; docs/LOGGING.md).
#
# Every Exteriq service writes one JSON event per line to stdout; systemd-journald stores
# it. This file makes rsyslog the ONE process that writes /var/log/exteriq/*: it reads the
# journal with a saved cursor (so events logged while rsyslog was down are picked up when
# it starts again), keeps only Exteriq units, parses each event and files it by stream:
#
#   application.json  everything that is not one of the streams below
#   errors.json       every event of level WARNING or higher (also in its own stream file)
#   scans.json        scan and stage lifecycle
#   alerts.json       committed finding changes (transactional outbox; exactly-once ids)
#   alerts.log        the same alerts as one human-readable line each (derived)
#   audit.json        export of the audit log (hash chain fields included)
#
# Lines that are not JSON (a crash before logging was configured, the broker's own log)
# are wrapped into a JSON object in application.json/errors.json, never dropped.

global(maxMessageSize="64k")

module(load="imjournal"
       StateFile="exteriq-imjournal.state"
       PersistStateInterval="100"
       IgnorePreviousMessages="on"
       Ratelimit.Interval="0"
)
module(load="mmjsonparse")

template(name="exteriq_json" type="string" string="%$!all-json-plain%\n")
template(name="exteriq_wrapped" type="list") {
    constant(value="{\"schema\":\"exteriq.event/1\",\"ts\":\"")
    property(name="timereported" dateFormat="rfc3339" date.inUTC="on")
    constant(value="\",\"service\":\"")
    property(name="programname" format="json")
    constant(value="\",\"level\":\"")
    property(name="$.level")
    constant(value="\",\"event\":\"process.output\",\"msg\":\"")
    property(name="msg" format="json" droplastlf="on")
    constant(value="\"}\n")
}
template(name="exteriq_alert_line" type="list") {
    property(name="$!ts")
    constant(value=" ")
    property(name="$!event")
    constant(value=" severity=")
    property(name="$!severity")
    constant(value=" status=")
    property(name="$!status")
    constant(value=" tenant=")
    property(name="$!tenant_id")
    constant(value=" finding=")
    property(name="$!finding_id")
    constant(value=" asset=")
    property(name="$!asset_id")
    constant(value=" title=\"")
    property(name="$!title" format="json")
    constant(value="\"\n")
}

ruleset(name="exteriq" queue.type="LinkedList" queue.size="50000"
        queue.filename="exteriq" queue.maxDiskSpace="256m" queue.saveOnShutdown="on") {
    action(type="mmjsonparse" cookie="")
    if $parsesuccess == "OK" and $!schema == "exteriq.event/1" then {
        if $!stream == "scans" then {
            action(type="omfile" file="/var/log/exteriq/scans.json" template="exteriq_json"
                   fileOwner="syslog" fileGroup="adm" fileCreateMode="0640" dirCreateMode="0750")
        } else if $!stream == "alerts" then {
            action(type="omfile" file="/var/log/exteriq/alerts.json" template="exteriq_json"
                   fileOwner="syslog" fileGroup="adm" fileCreateMode="0640" dirCreateMode="0750")
            action(type="omfile" file="/var/log/exteriq/alerts.log" template="exteriq_alert_line"
                   fileOwner="syslog" fileGroup="adm" fileCreateMode="0640" dirCreateMode="0750")
        } else if $!stream == "audit" then {
            action(type="omfile" file="/var/log/exteriq/audit.json" template="exteriq_json"
                   fileOwner="syslog" fileGroup="adm" fileCreateMode="0640" dirCreateMode="0750")
        } else {
            action(type="omfile" file="/var/log/exteriq/application.json" template="exteriq_json"
                   fileOwner="syslog" fileGroup="adm" fileCreateMode="0640" dirCreateMode="0750")
        }
        if $!level == "WARNING" or $!level == "ERROR" or $!level == "CRITICAL" then {
            action(type="omfile" file="/var/log/exteriq/errors.json" template="exteriq_json"
                   fileOwner="syslog" fileGroup="adm" fileCreateMode="0640" dirCreateMode="0750")
        }
    } else {
        if $syslogseverity <= 4 then {
            set $.level = "WARNING";
            action(type="omfile" file="/var/log/exteriq/application.json" template="exteriq_wrapped"
                   fileOwner="syslog" fileGroup="adm" fileCreateMode="0640" dirCreateMode="0750")
            action(type="omfile" file="/var/log/exteriq/errors.json" template="exteriq_wrapped"
                   fileOwner="syslog" fileGroup="adm" fileCreateMode="0640" dirCreateMode="0750")
        } else {
            set $.level = "INFO";
            action(type="omfile" file="/var/log/exteriq/application.json" template="exteriq_wrapped"
                   fileOwner="syslog" fileGroup="adm" fileCreateMode="0640" dirCreateMode="0750")
        }
    }
    stop
}

# One imjournal instance (rsyslog 8.2512 crashes on restart with a second one). Its
# messages enter the default ruleset here, before 50-default.conf: Exteriq's go to the
# exteriq ruleset; everything else from the journal is dropped, because the system's own
# messages already arrive through the syslog socket (imuxsock) and would be doubled.
if $inputname == "imjournal" then {
    if $programname startswith "exteriq-" then call exteriq
    stop
}
# The same events also arrive through the syslog socket; keep them out of /var/log/syslog.
if $programname startswith "exteriq-" then stop
