# Exteriq ASM log files (written only by rsyslog; docs/LOGGING.md).
# Run hourly by exteriq-logrotate.timer with its own state file (not by the system-wide
# daily logrotate, so a busy file is caught within the hour).
# Bounds: each file rotates daily or at 100 MB, whichever is first, and at most 14
# compressed generations are kept — about 1.5 GB per file in the worst case, usually far
# less. Rotation is by rsyslog's HUP (no copytruncate: no lost or duplicated lines).
/var/log/exteriq/application.json
/var/log/exteriq/errors.json
/var/log/exteriq/scans.json
/var/log/exteriq/alerts.json
/var/log/exteriq/alerts.log
/var/log/exteriq/audit.json
{
	daily
	maxsize 100M
	rotate 14
	maxage 30
	missingok
	notifempty
	compress
	delaycompress
	dateext
	dateformat -%Y%m%d-%s
	create 0640 syslog adm
	sharedscripts
	postrotate
		/usr/lib/rsyslog/rsyslog-rotate
	endscript
}
