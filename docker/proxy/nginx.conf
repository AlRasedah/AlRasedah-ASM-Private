# Exteriq ASM reverse proxy (single public entry point).
#   /api/*  -> asm-api:8000     (REST API + OpenAPI docs at /api/docs)
#   /*      -> asm-web:8080     (web UI)
# TLS: mount a certificate at /etc/nginx/certs/tls.crt|tls.key and set
# ASM_PROXY_TLS=on (see docs/DEPLOYMENT.md); HTTP then redirects to HTTPS.

limit_req_zone $binary_remote_addr zone=asm_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=asm_api:10m rate=40r/s;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream asm_api { server asm-api:8000; keepalive 16; }
upstream asm_web { server asm-web:8080; keepalive 8; }

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 5m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /api/v1/auth/ {
        limit_req zone=asm_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://asm_api;
    }

    location /api/ {
        limit_req zone=asm_api burst=80 nodelay;
        limit_req_status 429;
        proxy_pass http://asm_api;
    }

    location / {
        proxy_pass http://asm_web;
    }
}
