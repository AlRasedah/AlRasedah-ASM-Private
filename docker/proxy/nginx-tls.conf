# TLS-terminating variant of the reverse proxy.
# Use it by setting ASM_PROXY_CONF=./docker/proxy/nginx-tls.conf in .env and
# placing the certificate chain and key at ./docker/proxy/certs/tls.crt|tls.key.
#
# This file is rendered by the nginx image's envsubst at start-up, so
# ${ASM_PUBLIC_HTTPS_PORT} below is replaced with the published HTTPS port. That
# keeps the HTTP->HTTPS redirect correct even on a non-standard port (it will not
# send the browser to :443, which may be a different service). nginx runtime
# variables like $host / $request_uri are NOT env vars, so they are left intact.

limit_req_zone $binary_remote_addr zone=asm_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=asm_api:10m rate=40r/s;

upstream asm_api { server asm-api:8000; keepalive 16; }
upstream asm_web { server asm-web:8080; keepalive 8; }

server {
    listen 8080;
    server_name _;
    server_tokens off;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { return 301 https://$host:${ASM_PUBLIC_HTTPS_PORT}$request_uri; }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    server_tokens off;
    client_max_body_size 5m;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ASMTLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;

    location /api/v1/auth/ {
        limit_req zone=asm_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://asm_api;
    }
    location /api/ {
        limit_req zone=asm_api burst=80 nodelay;
        limit_req_status 429;
        proxy_pass http://asm_api;
    }
    location / { proxy_pass http://asm_web; }
}
