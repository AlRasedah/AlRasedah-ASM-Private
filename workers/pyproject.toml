[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asm-sensors"
version = "0.1.0"
description = "Exteriq ASM sensor framework: scanner adapters that emit scanner-independent observations"
requires-python = ">=3.12"
license = { text = "LicenseRef-AlRasedah-Proprietary" }
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "dnspython>=2.6",
]

[project.optional-dependencies]
# Only the scanner worker container needs Celery; the platform only imports the schema.
worker = [
  "celery[redis]>=5.4",
  "cryptography>=42",
]

[tool.setuptools.packages.find]
include = ["asm_sensors*"]

[tool.setuptools.package-data]
asm_sensors = ["py.typed"]
